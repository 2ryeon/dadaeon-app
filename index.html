      else if(page==='id') body=`<button class="back" onclick="page='home';render()">← 홈</button><h1 class="page-title">학생증</h1><p class="sub">나의 모바일 학생증을 확인하세요.</p><div class="physical-wrap">${studentCard(s)}</div><p class="id-caption">다대고등학교 모바일 학생증 · 본인 확인용</p><button class="primary" onclick="page='nfc';render()">NFC 태그로 등교하기</button>`;

      else if(page==='my') { const mine=offsetRequests.filter(r=>r.studentId===s.id); body=`<div class="topbar"><div><h2>MY</h2><p class="welcome">${nameOf(s)} 학생의 학교생활 관리</p></div><button class="logout" onclick="logout()">로그아웃</button></div><div class="section-title"><h2>나의 상벌점</h2><button onclick="page='points';render()">상세 보기</button></div><div class="summary"><div class="card stat"><small>상점</small><strong class="merit">+${s.merit}</strong></div><div class="card stat"><small>벌점</small><strong class="demerit">-${s.demerit}</strong></div></div><div class="section-title"><h2>벌점 상쇄활동</h2></div><div class="card"><b>상쇄활동 신청</b><p style="font-size:13px">봉사·캠페인 활동으로 벌점 상쇄를 신청할 수 있습니다. 생활안전부 승인 후 반영됩니다.</p><button class="primary" onclick="openOffsetRequest('${s.id}')">상쇄활동 신청하기</button>${s.demerit===0?'<p style="font-size:11px;margin:10px 0 0">현재 벌점이 0점입니다. 활동 신청은 가능하지만 승인 시 차감할 벌점은 없습니다.</p>':''}</div><div class="history"><h3>신청 내역</h3>${mine.length?mine.map(requestHTML).join(''):'<div class="empty">상쇄활동 신청 내역이 없습니다.</div>'}</div>`; }

    const studentNo = s => `2026${s.grade}0${String(s.number).padStart(2,'0')}`;
    function studentCard(s){return `<article class="physical-id"><div class="physical-title">학생증</div><div class="physical-photo"><div class="portrait-hair ${s.gender==='여'?'female':''}"></div><div class="portrait-head"></div><div class="portrait-body"></div></div><div class="physical-name"><span>성명</span><b>${nameOf(s)}</b></div><div class="physical-meta"><div><span>학번</span><b>${studentNo(s)}</b></div><div><span>학적</span><b>${s.grade}학년 ${s.number}번</b></div></div><div class="physical-school"><span>다대고등학교</span><small>DADAE HIGH SCHOOL</small></div></article>`;}
    function mealMonth(){return Object.entries(mealCalendar).map(([day,menu])=>`<article class="meal-day ${Number(day)===21?'today':''}"><div class="meal-date">10월 ${day}일${Number(day)===21?'<small>오늘</small>':''}</div><div class="meal-menu">${menu.map(item=>`<div>${item}</div>`).join('')}</div></article>`).join('');}

    function requestHTML(r){const labels={pending:'승인 대기',approved:'승인 완료',rejected:'반려'};const colors={pending:'#a46b00',approved:'#087c58',rejected:'#c43f49'};return `<div class="list-item"><div class="list-icon">🤝</div><div><b>${r.activity}</b><small>활동 예정 ${r.activityDate} · ${r.activityTime}</small></div><span class="value" style="color:${colors[r.status]}">${labels[r.status]}</span></div>`;}
    const activityTimes={'교내 환경정화 봉사':'학교 가는 날','교문지도':'아침 등교 시간','도서관 정리 봉사':'점심시간','생활안전교육 이수':'수업 종료 후'};

    function updateActivityTime(activity){document.getElementById('activityTimeHint').textContent=`활동 시간 · ${activityTimes[activity]}  |  상쇄 가능 · ${activityScores[activity]}점`;document.querySelector('#modal input[name="score"]').value=activityScores[activity];}
    function openOffsetRequest(studentId){document.getElementById('modal').innerHTML=`<div class="sheet"><div class="sheet-head"><div><h2>상쇄활동 신청</h2><small>생활안전부 부장 한기동 선생님께 전달됩니다.</small></div><button class="close" onclick="closeModal()">×</button></div><form class="edit-form" onsubmit="submitOffsetRequest(event,'${studentId}')"><label>활동 종류<select name="activity" onchange="updateActivityTime(this.value)"><option>교내 환경정화 봉사</option><option>교문지도</option><option>도서관 정리 봉사</option><option>생활안전교육 이수</option></select></label><div id="activityTimeHint" class="record" style="margin:0">활동 시간 · 학교 가는 날  |  상쇄 가능 · 2점</div><label>활동 예정일<input name="activityDate" type="date" min="2026-10-21" value="2026-10-22" required></label><label>상쇄 가능 점수<input name="score" type="number" value="2" readonly></label><label>활동 내용<input name="note" placeholder="예: 교내 환경정화 활동 참여" required></label><button class="primary" type="submit">신청서 제출</button><p style="font-size:11px;margin:0;color:var(--muted)">주말과 휴업일에는 활동을 신청할 수 없습니다.</p></form></div>`;document.getElementById('modal').classList.remove('hidden');}
    function submitOffsetRequest(e,studentId){e.preventDefault();const f=new FormData(e.target),activity=f.get('activity'),activityDate=f.get('activityDate');if(!isSchoolDay(activityDate)){toast('주말 또는 휴업일은 활동 예정일로 선택할 수 없습니다.');return;}offsetRequests.unshift({id:'offset-'+Date.now(),studentId,activity,activityDate,activityTime:activityTimes[activity],score:activityScores[activity],note:f.get('note'),status:'pending',date:'2026.10.21'});persist();closeModal();render();toast('상쇄활동 신청이 한기동 선생님께 전달되었습니다.');}
    function nfcTag(studentId){const zone=document.getElementById('tagZone');zone.classList.add('tagging');tone();setTimeout(()=>{let existing=attendance.find(a=>a.studentId===studentId&&a.date==='2026-10-21');if(!existing){attendance.push({studentId,date:'2026-10-21',time:'08:12',method:'demo'});persist();} render();toast('✓ NFC 태그 완료 · 08:12 등교 처리');},1500);}
    function tone(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(880,c.currentTime);g.gain.setValueAtTime(.07,c.currentTime);o.start();o.frequency.exponentialRampToValueAtTime(1320,c.currentTime+.16);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.28);o.stop(c.currentTime+.3);}catch(e){}}
    function renderTeacher(){const pending=offsetRequests.filter(r=>r.status==='pending');let body='';if(page==='home')body=`<div class="topbar"><div><h2>한기동 선생님</h2><p class="welcome">수학 · 3학년 4반 담임 · 생활안전부 부장</p></div><button class="logout" onclick="logout()">로그아웃</button></div><div class="card" style="background:linear-gradient(135deg,#fff7df,#fff);border-color:#f5dfab"><b>학생 생활기록 관리</b><p style="font-size:13px;margin-bottom:0">학생별 상벌점을 조회하고 즉시 수정할 수 있습니다.</p></div><button class="card" style="width:100%;text-align:left;margin-top:12px;border-color:${pending.length?'#9fd7bd':'var(--line)'}" onclick="page='requests';render()"><b>🔔 상쇄활동 승인 요청 ${pending.length}건</b><p style="font-size:13px;margin:5px 0 0">${pending.length?'학생의 신청서를 확인해 승인 또는 반려해 주세요.':'새로운 상쇄활동 신청이 없습니다.'}</p></button><div class="section-title"><h2>관리 학생</h2><button onclick="page='students';render()">전체 보기</button></div>${students.map(s=>teacherRow(s)).join('')}<div class="section-title"><h2>오늘의 등교</h2></div><div class="card"><b>${attendance.length}명</b> <small>시연 기준 NFC 등교 처리</small></div>`;

      else if(page==='attendance')body=listPage('등교 기록','2026년 10월 21일',attendance.length?attendance.map(a=>{const s=students.find(x=>x.id===a.studentId);return `<div class="list-item"><div class="list-icon">✓</div><div><b>${nameOf(s)}</b><small>NFC 태그 · ${a.time}</small></div><span class="merit">등교</span></div>`}).join(''):'<div class="empty">아직 NFC 태그 기록이 없습니다.</div>');
      else if(page==='requests')body=listPage('상쇄활동 알림',`승인 대기 ${pending.length}건`,offsetRequests.length?offsetRequests.map(teacherRequestHTML).join(''):'<div class="empty">상쇄활동 신청 내역이 없습니다.</div>');
      document.getElementById('appContent').innerHTML=body;nav([{id:'home',icon:'⌂',label:'홈'},{id:'students',icon:'👥',label:'학생 관리'},{id:'attendance',icon:'✓',label:'등교 기록'},{id:'requests',icon:'🔔',label:'알림'}]);}
    function teacherRow(s){return `<div class="person-row"><div class="avatar" style="background:${s.color}">${nameOf(s).slice(0,1)}</div><div><b>${nameOf(s)}</b><small>${s.grade}학년 ${s.number}번 · ${s.gender}학생</small></div><div class="points-badge"><span class="merit">+${s.merit}</span> / <span class="demerit">-${s.demerit}</span></div><button onclick="openStudent('${s.id}')">관리</button></div>`;}
    function teacherRequestHTML(r){const s=students.find(x=>x.id===r.studentId),labels={pending:'승인 대기',approved:'승인 완료',rejected:'반려'};return `<div class="list-item" style="display:block"><div style="display:flex;gap:12px;align-items:center"><div class="list-icon">🔔</div><div><b>${nameOf(s)} · ${r.activity}</b><small>활동 예정 ${r.activityDate} · ${r.activityTime} · ${r.score}점 상쇄</small></div><span class="value ${r.status==='approved'?'merit':r.status==='rejected'?'demerit':''}">${labels[r.status]}</span></div><p style="font-size:12px;margin:9px 0 0;color:var(--muted)">활동 내용: ${r.note}</p>${r.status==='pending'?`<div style="display:flex;gap:8px;margin-top:10px"><button class="secondary" style="flex:1" onclick="reviewOffset('${r.id}','approved')">승인</button><button class="secondary" style="flex:1;color:var(--red);background:#fff0f1" onclick="reviewOffset('${r.id}','rejected')">반려</button></div>`:''}</div>`;}
    function reviewOffset(id,status){const request=offsetRequests.find(r=>r.id===id);if(!request||request.status!=='pending')return;request.status=status;request.reviewedAt='2026.10.21';const s=students.find(x=>x.id===request.studentId);if(status==='approved'){const deducted=Math.min(s.demerit,request.score);s.demerit-=deducted;request.deducted=deducted;}persist();render();toast(`${nameOf(s)} 학생의 상쇄활동을 ${status==='approved'?'승인':'반려'}했습니다.`);}
    function filterStudents(q){document.getElementById('studentRows').innerHTML=students.filter(s=>nameOf(s).includes(q)).map(teacherRow).join('')||'<div class="empty">검색 결과가 없습니다.</div>';}
    function openStudent(id){const s=students.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<div class="sheet"><div class="sheet-head"><div><h2>${nameOf(s)} 학생 관리</h2><small>${s.grade}학년 ${s.number}번 · ${s.gender}학생</small></div><button class="close" onclick="closeModal()">×</button></div><div class="summary"><div class="card stat"><small>상점</small><strong class="merit">+${s.merit}</strong></div><div class="card stat"><small>벌점</small><strong class="demerit">-${s.demerit}</strong></div></div><div class="section-title"><h2>상벌점 등록·차감</h2></div><form class="edit-form" onsubmit="savePoint(event,'${s.id}')"><label>처리<select name="operation"><option value="merit-add">상점 부여</option><option value="demerit-add">벌점 부여</option><option value="merit-sub">상점 차감</option><option value="demerit-sub">벌점 차감</option></select></label><label>점수<input name="score" type="number" min="1" max="20" value="1" required></label><label>사유<input name="reason" placeholder="예: 교내 봉사활동 참여" required></label><button class="primary" type="submit">기록 저장</button></form><div class="section-title"><h2>학생 기본 정보</h2></div><form class="edit-form" onsubmit="saveStudentInfo(event,'${s.id}')"><label>이름<input name="name" value="${nameOf(s)}" required></label><label>학년 / 번호<div style="display:flex;gap:8px"><input name="grade" type="number" min="1" max="3" value="${s.grade}" required><input name="number" type="number" min="1" max="40" value="${s.number}" required></div></label><button class="secondary" type="submit">학생 기본 정보 저장</button></form><div class="history"><h3>변동 내역</h3>${records.filter(r=>r.studentId===id).length?records.filter(r=>r.studentId===id).map(recordHTML).join(''):'<div class="empty">등록된 변동 내역이 없습니다.</div>'}</div></div>`;document.getElementById('modal').classList.remove('hidden');}
    function closeModal(){document.getElementById('modal').classList.add('hidden');}
    function savePoint(e,id){e.preventDefault();const f=new FormData(e.target),[type,direction]=f.get('operation').split('-'),score=Number(f.get('score')),reason=f.get('reason');const s=students.find(x=>x.id===id),delta=direction==='add'?score:-score;if(s[type]+delta<0){toast('현재 점수보다 많이 차감할 수 없습니다.');return;}s[type]+=delta;records.unshift({studentId:id,type,score,delta,reason,date:'2026.10.21'});persist();closeModal();render();toast(`${nameOf(s)} 학생 ${type==='merit'?'상점':'벌점'} ${Math.abs(delta)}점 ${delta>0?'부여':'차감'} 완료`);}
    function saveStudentInfo(e,id){e.preventDefault();const f=new FormData(e.target),s=students.find(x=>x.id===id);s.name=f.get('name');s.grade=Number(f.get('grade'));s.number=Number(f.get('number'));persist();closeModal();render();toast('학생 기본 정보가 저장되었습니다.');}
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400);}
  </script>
</body>
</html>
