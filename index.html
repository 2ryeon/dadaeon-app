    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
    :root { --forest:#006b4d; --green:#008b63; --soft-green:#eaf7f1; --mint:#dff5e9; --ink:#15362d; --muted:#6f827a; --line:#e1ece6; --bg:#f8fbf9; --red:#d44e58; }
    * { box-sizing:border-box; } body { margin:0; font-family:Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif; color:var(--ink); background:#eaf2ee; }
    button, input, select { font:inherit; } button { cursor:pointer; border:0; }
    .phone { width:min(100%, 440px); min-height:100vh; margin:auto; background:var(--bg); overflow:hidden; position:relative; }
    .screen { min-height:100vh; padding:32px 20px 100px; } .hidden { display:none !important; }
    .brand { display:flex; gap:12px; align-items:center; margin-bottom:30px; } .brand-mark { width:48px; height:48px; object-fit:cover; border-radius:14px; box-shadow:0 6px 15px #006b4d24; }
    .brand b { display:block; color:var(--forest); font-family:'Jua','Arial Rounded MT Bold',sans-serif; font-size:24px; font-weight:400; letter-spacing:-1.25px; line-height:1; text-shadow:1px 1px 0 #c8f0dc; } .brand small { color:var(--muted); }
    h1 { font-size:28px; letter-spacing:-1.3px; margin:0 0 10px; } h2 { font-size:20px; margin:0; letter-spacing:-.6px; } p { color:var(--muted); line-height:1.55; }
    .role-grid { display:grid; gap:14px; margin-top:30px; } .role { text-align:left; background:#fff; border:1px solid var(--line); border-radius:22px; padding:21px; display:flex; align-items:center; gap:16px; box-shadow:0 6px 18px #13223b08; }
    .role:hover { border-color:var(--green); transform:translateY(-1px); }.role-icon { width:54px; height:54px; border-radius:18px; display:grid; place-items:center; font-size:27px; background:var(--soft-green); }.role.teacher .role-icon { background:var(--mint); }.role strong { display:block; font-size:17px; }.role span { font-size:13px; color:var(--muted); display:block; margin-top:4px; }
    .account-list { display:grid; gap:10px; margin-top:20px; }.account { background:#fff; border:1px solid var(--line); border-radius:17px; padding:14px; text-align:left; display:flex; align-items:center; gap:12px; }.avatar { border-radius:50%; width:42px; height:42px; display:grid; place-items:center; flex:none; color:#fff; font-weight:800; background:linear-gradient(140deg,#20a67b,#006b4d); }.account small { color:var(--muted); display:block; margin-top:3px; }.account .arrow { margin-left:auto; color:var(--green); font-size:20px; }
    .back { color:var(--green); background:transparent; padding:0; margin-bottom:22px; font-weight:700; }.topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }.welcome { font-size:13px; color:var(--muted); margin:3px 0 0; }.logout { color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:20px; padding:17px; }.id-card { color:#fff; background:linear-gradient(135deg,#005d45,#008b63 68%,#39ad86); min-height:180px; border:0; position:relative; overflow:hidden; padding:20px; box-shadow:0 12px 25px #006b4d32; }.id-card::after { content:""; position:absolute; border:1px solid #fff4; width:190px; height:190px; right:-70px; top:-75px; border-radius:50%; }.id-head { font-size:12px; opacity:.8; }.id-name { font-weight:800; font-size:27px; margin-top:22px; }.id-info { font-size:13px; opacity:.82; margin-top:5px; }.chip { width:33px; height:24px; margin-top:18px; border-radius:5px; background:linear-gradient(135deg,#e9fff5,#9be0bf); }.tap { position:absolute; right:20px; bottom:20px; font-size:30px; }
    .section-title { display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px; }.section-title button { color:var(--green); background:transparent; font-size:12px; font-weight:700; }.summary { display:grid; grid-template-columns:1fr 1fr; gap:10px; }.stat { padding:15px; }.stat small, .list-item small { color:var(--muted); display:block; }.stat strong { font-size:25px; margin-top:5px; display:block; }.merit { color:#087c58; }.demerit { color:var(--red); }
    .quick { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }.quick button { background:#fff; border:1px solid var(--line); border-radius:15px; padding:12px 4px; color:var(--ink); font-size:11px; }.quick i { display:block; font-style:normal; font-size:21px; margin-bottom:5px; }

    .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:min(100%,440px); display:flex; justify-content:space-around; background:#fffffff2; backdrop-filter:blur(12px); border-top:1px solid var(--line); padding:11px 8px calc(11px + env(safe-area-inset-bottom)); z-index:5; }.bottom-nav button { color:#8a9690; background:transparent; font-size:10px; min-width:55px; }.bottom-nav button span { display:block; font-size:20px; margin-bottom:3px; }.bottom-nav .active { color:var(--green); font-weight:800; }
    .page-title { margin:0 0 5px; }.sub { margin:0 0 20px; font-size:13px; }.nfc-zone { padding:28px 20px; text-align:center; }.nfc-orb { width:112px; height:112px; border-radius:50%; margin:5px auto 20px; display:grid; place-items:center; font-size:48px; background:radial-gradient(circle,#e8faf2 20%,#b8e8d2 52%,#35a77e 53%,#008b63 65%,#005d45 66%); color:#fff; box-shadow:0 0 0 11px #008b6319; }.primary { width:100%; padding:15px; color:#fff; background:var(--green); border-radius:14px; font-weight:800; box-shadow:0 8px 16px #008b6333; }.secondary { padding:10px 12px; border-radius:10px; color:var(--green); background:var(--soft-green); font-size:12px; font-weight:700; }.record { margin-top:15px; background:var(--mint); color:#087c58; border-radius:13px; padding:12px; font-size:13px; }.tagging .nfc-orb { animation:pulse .7s ease-in-out 3; }.tagging .id-card { animation:tilt .55s ease-in-out 3; } @keyframes pulse { 50% { transform:scale(1.1); box-shadow:0 0 0 24px #008b631d; } } @keyframes tilt { 50% { transform:rotate(-2deg) scale(1.02); } }

    .filter { width:100%; background:#fff; border:1px solid var(--line); padding:12px; border-radius:12px; margin:10px 0 14px; }.person-row { background:#fff; border:1px solid var(--line); padding:14px; border-radius:16px; margin:9px 0; display:flex; align-items:center; gap:11px; }.person-row button { margin-left:auto; color:var(--green); background:var(--soft-green); border-radius:9px; padding:8px 10px; font-size:12px; font-weight:700; }.points-badge { font-size:12px; margin-left:auto; margin-right:8px; }.edit-form { display:grid; gap:11px; }.edit-form label { font-size:12px; font-weight:700; color:var(--muted); }.edit-form input,.edit-form select,.edit-form textarea { width:100%; border:1px solid var(--line); border-radius:11px; padding:11px; margin-top:5px; background:#fff; }.edit-form textarea{resize:vertical}.modal { position:fixed; inset:0; z-index:10; background:#0d3b2d8f; display:grid; align-items:end; }.sheet { background:var(--bg); border-radius:25px 25px 0 0; padding:22px 20px calc(28px + env(safe-area-inset-bottom)); max-height:86vh; overflow:auto; }.sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }.close { background:#e7f0eb; border-radius:50%; width:30px; height:30px; font-size:17px; }.history { margin-top:16px; }.history h3 { font-size:14px; }.empty { padding:28px 10px; text-align:center; color:var(--muted); }.toast { position:fixed; z-index:30; left:50%; bottom:88px; transform:translateX(-50%); background:#064a36; color:#fff; padding:12px 16px; border-radius:12px; font-size:13px; box-shadow:0 8px 22px #0003; }

    function mealMonth(month){const d=new Date(),calendar=month===10?mealCalendar:novemberMealCalendar;return Object.entries(calendar).map(([day,menu])=>{const isToday=d.getFullYear()===2026&&d.getMonth()+1===month&&d.getDate()===Number(day);return `<article class="meal-day ${isToday?'today':''}"><div class="meal-date">${month}월 ${day}일${isToday?'<small>오늘</small>':''}</div><div class="meal-menu">${menu.map(item=>`<div>${item}</div>`).join('')}</div></article>`;}).join('');}

    function requestHTML(r){const labels={pending:'일정 승인 대기',approved:'활동 인증 필요','proof-pending':'인증 확인 대기',completed:'상쇄 완료',rejected:'신청 반려'},colors={pending:'#a46b00',approved:'#087c58','proof-pending':'#a46b00',completed:'#087c58',rejected:'#c43f49'};return `<div class="card" style="margin-top:10px"><div class="list-item"><div class="list-icon">🤝</div><div><b>${r.activity}</b><small>활동 예정 ${r.activityDate} · ${r.activityTime}</small></div><span class="value" style="color:${colors[r.status]||'#6f827a'}">${labels[r.status]||r.status}</span></div>${r.status==='approved'?`<div class="proof-guide">활동을 마친 뒤 인증 기록을 올려 주세요.<br>사진에는 촬영 일자·시간이 표시되어야 하며, 활동한 본인의 얼굴 또는 몸이 반드시 보여야 합니다.</div><button class="primary" style="margin-top:10px" onclick="openProofUpload('${r.id}')">활동 인증 기록 올리기</button>`:''}${r.status==='proof-pending'?'<p style="font-size:12px;margin-bottom:0">선생님이 활동 인증을 확인하고 있습니다. 최종 승인 후 벌점이 차감됩니다.</p>':''}${r.status==='completed'?`<p class="record">✓ 인증 완료 · 벌점 ${r.deducted||0}점 상쇄</p>`:''}</div>`;}
    let proofCameraStream=null,proofCapturedPhoto=null,proofCapturedAt=null;

    function openProofUpload(id){const request=offsetRequests.find(r=>r.id===id);if(!request||request.status!=='approved')return;proofCapturedPhoto=null;proofCapturedAt=null;document.getElementById('modal').innerHTML=`<div class="sheet"><div class="sheet-head"><div><h2>활동 인증 기록</h2><small>${request.activity} · ${request.activityDate}</small></div><button class="close" onclick="closeModal()">×</button></div><div class="proof-guide"><b>사진 인증 필수 조건</b><br>① 사진에 촬영 일자와 시간이 보여야 합니다.<br>② 활동하는 본인의 얼굴 또는 몸이 반드시 나와야 합니다.<br>③ 다른 사람의 사진이나 활동 전 사진은 인정되지 않습니다.</div><form class="edit-form" style="margin-top:14px" onsubmit="submitProof(event,'${id}')"><label>활동 기록 (50자 이내)<textarea name="proofText" maxlength="50" rows="3" required oninput="this.nextElementSibling.textContent=this.value.length+' / 50자'" placeholder="실제로 한 활동을 간단히 적어 주세요."></textarea><div class="char-count">0 / 50자</div></label><div><b style="font-size:12px">인증 사진</b><button type="button" class="secondary" style="display:block;margin:8px 0" onclick="startProofCamera()">📷 앱에서 사진 찍기</button><video id="proofCamera" autoplay playsinline muted style="display:none;width:100%;border-radius:13px"></video><button id="proofShutter" type="button" class="primary hidden" onclick="captureProofPhoto()">사진 촬영</button><img id="proofPreview" class="proof-photo hidden" alt="촬영한 인증 사진"><small id="proofCaptureTime" style="display:block;color:var(--muted)"></small><label>또는 사진 선택<input name="proofPhoto" type="file" accept="image/*" onchange="proofCapturedPhoto=null;proofCapturedAt=null;document.getElementById('proofCaptureTime').textContent=''"></label></div><label class="remember"><input name="proofConfirm" type="checkbox" required>사진에 일자·시간과 본인의 얼굴 또는 몸이 보이는 것을 확인했습니다.</label><button class="primary" type="submit">선생님께 인증 제출</button></form></div>`;document.getElementById('modal').classList.remove('hidden');}
    async function startProofCamera(){if(!navigator.mediaDevices?.getUserMedia){toast('카메라를 사용할 수 없습니다. HTTPS 환경에서 열거나 사진을 선택해 주세요.');return;}try{stopProofCamera();const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});if(document.getElementById('modal').classList.contains('hidden')){stream.getTracks().forEach(track=>track.stop());return;}proofCameraStream=stream;const video=document.getElementById('proofCamera');video.srcObject=stream;video.style.display='block';document.getElementById('proofShutter').classList.remove('hidden');await video.play();}catch(e){toast('카메라 권한을 허용하거나 사진을 선택해 주세요.');}}
    function captureProofPhoto(){const video=document.getElementById('proofCamera');if(!video?.videoWidth)return;const canvas=document.createElement('canvas'),scale=Math.min(1,720/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);proofCapturedPhoto=canvas.toDataURL('image/jpeg',.72);proofCapturedAt=captureTimeLabel();document.getElementById('proofPreview').src=proofCapturedPhoto;document.getElementById('proofPreview').classList.remove('hidden');document.getElementById('proofCaptureTime').textContent=`앱에서 촬영 · ${proofCapturedAt}`;document.querySelector('#modal input[name="proofPhoto"]').value='';video.style.display='none';document.getElementById('proofShutter').classList.add('hidden');stopProofCamera();}
    function submitProof(e,id){e.preventDefault();const request=offsetRequests.find(r=>r.id===id),form=new FormData(e.target),text=String(form.get('proofText')||'').trim(),file=form.get('proofPhoto');if(!request||request.status!=='approved')return;if(todayKey()!==request.activityDate){toast('활동 인증은 승인된 활동 당일에만 올릴 수 있습니다.');return;}if(!text||text.length>50){toast('활동 기록은 1~50자로 작성해 주세요.');return;}const savePhoto=photo=>{request.proofText=text;request.proofPhoto=photo;request.proofCapturedAt=proofCapturedAt;request.proofSubmittedAt=todayLabel();request.status='proof-pending';persist();notificationTone();closeModal();render();toast('🔔 활동 인증이 선생님께 전달되었습니다.');};if(proofCapturedPhoto){savePhoto(proofCapturedPhoto);return;}if(!file||!file.type.startsWith('image/')){toast('인증 사진을 찍거나 선택해 주세요.');return;}const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const scale=Math.min(1,720/image.width),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);savePhoto(canvas.toDataURL('image/jpeg',.72));};image.src=reader.result;};reader.readAsDataURL(file);}
    const activityTimes={'교내 환경정화 봉사':'학교 가는 날','교문지도':'아침 등교 시간','도서관 정리 봉사':'점심시간','생활안전교육 이수':'수업 종료 후'};

    function openOffsetRequest(studentId){document.getElementById('modal').innerHTML=`<div class="sheet"><div class="sheet-head"><div><h2>상쇄활동 신청</h2><small>생활안전부 부장 한기동 선생님께 전달됩니다.</small></div><button class="close" onclick="closeModal()">×</button></div><form class="edit-form" onsubmit="submitOffsetRequest(event,'${studentId}')"><label>활동 종류<select name="activity" onchange="updateActivityTime(this.value)"><option>교내 환경정화 봉사</option><option>교문지도</option><option>도서관 정리 봉사</option><option>생활안전교육 이수</option></select></label><div id="activityTimeHint" class="record" style="margin:0">활동 시간 · 학교 가는 날  |  상쇄 가능 · 2점</div><label>활동 예정일<input name="activityDate" type="date" min="${todayKey()}" value="${todayKey()}" required></label><label>상쇄 가능 점수<input name="score" type="number" value="2" readonly></label><label>활동 내용<input name="note" placeholder="예: 교내 환경정화 활동 참여" required></label><button class="primary" type="submit">신청서 제출</button><p style="font-size:11px;margin:0;color:var(--muted)">주말과 휴업일에는 활동을 신청할 수 없습니다.</p></form></div>`;document.getElementById('modal').classList.remove('hidden');}

    function tone(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(880,c.currentTime);g.gain.setValueAtTime(.07,c.currentTime);o.start();o.frequency.exponentialRampToValueAtTime(1320,c.currentTime+.16);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.28);o.stop(c.currentTime+.3);}catch(e){}}

    function renderTeacher(){const pending=offsetRequests.filter(r=>r.status==='pending'),proofPending=offsetRequests.filter(r=>r.status==='proof-pending'),alertCount=pending.length+proofPending.length;let body='';if(page==='home')body=`<div class="topbar"><div><h2>한기동 선생님</h2><p class="welcome">수학 · 3학년 4반 담임 · 생활안전부 부장</p></div><button class="logout" onclick="logout()">로그아웃</button></div><div class="card" style="background:linear-gradient(135deg,#fff7df,#fff);border-color:#f5dfab"><b>학생 생활기록 관리</b><p style="font-size:13px;margin-bottom:0">학생별 상벌점을 조회하고 즉시 수정할 수 있습니다.</p></div><button class="card ${alertCount?'notification-alert':''}" style="width:100%;text-align:left;margin-top:12px" onclick="page='requests';render()"><b>🔔 확인할 상쇄활동 ${alertCount}건</b><p style="font-size:13px;margin:5px 0 0">${alertCount?`일정 승인 ${pending.length}건 · 활동 인증 ${proofPending.length}건`:'새로운 상쇄활동 알림이 없습니다.'}</p></button><div class="section-title"><h2>관리 학생</h2><button onclick="page='students';render()">전체 보기</button></div>${students.map(s=>teacherRow(s)).join('')}<div class="section-title"><h2>오늘의 등교</h2></div><div class="card"><b>${attendance.filter(a=>a.date===todayKey()).length}명</b> <small>오늘 등교 완료</small></div>`;

      document.getElementById('appContent').innerHTML=body;nav([{id:'home',icon:'⌂',label:'홈'},{id:'students',icon:'👥',label:'학생 관리'},{id:'attendance',icon:'✓',label:'등교 기록'},{id:'requests',icon:'🔔',label:'알림'}]);}
    function teacherRow(s){return `<div class="person-row"><div class="avatar" style="background:${s.color}">${nameOf(s).slice(0,1)}</div><div><b>${nameOf(s)}</b><small>${s.grade}학년 ${s.number}번 · ${s.gender}학생</small></div><div class="points-badge"><span class="merit">+${s.merit}</span> / <span class="demerit">-${s.demerit}</span></div><button onclick="openStudent('${s.id}')">관리</button></div>`;}
    function teacherRequestHTML(r){const s=students.find(x=>x.id===r.studentId),labels={pending:'일정 승인 대기',approved:'활동 대기','proof-pending':'인증 확인 필요',completed:'상쇄 완료',rejected:'신청 반려'};return `<div class="card" style="margin-top:10px"><div class="list-item"><div class="list-icon">🔔</div><div><b>${nameOf(s)} · ${r.activity}</b><small>활동 예정 ${r.activityDate} · ${r.activityTime} · ${r.score}점 상쇄</small></div><span class="value">${labels[r.status]||r.status}</span></div><p style="font-size:12px;color:var(--muted)">신청 내용: ${escapeHTML(r.note)}</p>${r.status==='pending'?`<div style="display:flex;gap:8px"><button class="secondary" style="flex:1" onclick="reviewOffset('${r.id}','approved')">일정 승인</button><button class="secondary" style="flex:1;color:var(--red);background:#fff0f1" onclick="reviewOffset('${r.id}','rejected')">반려</button></div>`:''}${r.status==='approved'?'<p class="record">일정 승인 완료 · 학생의 활동 인증을 기다리는 중</p>':''}${r.status==='proof-pending'?`<div class="proof-guide"><b>학생 활동 기록</b><br>${escapeHTML(r.proofText)}${r.proofCapturedAt?`<small style="display:block;margin-top:6px">앱에서 촬영: ${escapeHTML(r.proofCapturedAt)}</small>`:''}<small style="display:block">제출: ${escapeHTML(r.proofSubmittedAt)}</small></div><img class="proof-photo" src="${r.proofPhoto}" alt="학생 활동 인증 사진"><div style="display:flex;gap:8px;margin-top:10px"><button class="secondary" style="flex:1" onclick="reviewProof('${r.id}',true)">인증 승인·벌점 상쇄</button><button class="secondary" style="flex:1;color:var(--red);background:#fff0f1" onclick="reviewProof('${r.id}',false)">인증 반려</button></div>`:''}${r.status==='completed'?`<p class="record">✓ 활동 인증 완료 · 벌점 ${r.deducted||0}점 상쇄됨</p>`:''}</div>`;}
    function reviewOffset(id,status){const request=offsetRequests.find(r=>r.id===id);if(!request||request.status!=='pending')return;request.status=status;request.reviewedAt=todayLabel();persist();render();toast(status==='approved'?'활동 일정을 승인했습니다. 인증 완료 전에는 벌점이 차감되지 않습니다.':'상쇄활동 신청을 반려했습니다.');}
    function reviewProof(id,approved){const request=offsetRequests.find(r=>r.id===id);if(!request||request.status!=='proof-pending')return;const s=students.find(x=>x.id===request.studentId);if(approved){const deducted=Math.min(s.demerit,request.score);s.demerit-=deducted;request.deducted=deducted;request.status='completed';request.completedAt=todayLabel();records.unshift({studentId:s.id,type:'demerit',score:deducted,delta:-deducted,reason:`상쇄활동 완료: ${request.activity}`,date:todayLabel()});}else{request.status='approved';delete request.proofPhoto;delete request.proofText;request.proofRejectedAt=todayLabel();}persist();render();toast(approved?`${nameOf(s)} 학생의 인증을 승인해 벌점 ${request.deducted}점을 상쇄했습니다.`:'인증을 반려했습니다. 학생이 다시 제출할 수 있습니다.');}
    function filterStudents(q){document.getElementById('studentRows').innerHTML=students.filter(s=>nameOf(s).includes(q)).map(teacherRow).join('')||'<div class="empty">검색 결과가 없습니다.</div>';}
    function openStudent(id){const s=students.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<div class="sheet"><div class="sheet-head"><div><h2>${nameOf(s)} 학생 관리</h2><small>${s.grade}학년 ${s.number}번 · ${s.gender}학생</small></div><button class="close" onclick="closeModal()">×</button></div><div class="summary"><div class="card stat"><small>상점</small><strong class="merit">+${s.merit}</strong></div><div class="card stat"><small>벌점</small><strong class="demerit">-${s.demerit}</strong></div></div><div class="section-title"><h2>상벌점 등록·차감</h2></div><form class="edit-form" onsubmit="savePoint(event,'${s.id}')"><label>처리<select name="operation"><option value="merit-add">상점 부여</option><option value="demerit-add">벌점 부여</option><option value="merit-sub">상점 차감</option><option value="demerit-sub">벌점 차감</option></select></label><label>점수<input name="score" type="number" min="1" max="20" value="1" required></label><label>사유<input name="reason" placeholder="예: 교내 봉사활동 참여" required></label><button class="primary" type="submit">기록 저장</button></form><div class="section-title"><h2>학생 기본 정보</h2></div><form class="edit-form" onsubmit="saveStudentInfo(event,'${s.id}')"><label>이름<input name="name" value="${nameOf(s)}" required></label><label>학년 / 번호<div style="display:flex;gap:8px"><input name="grade" type="number" min="1" max="3" value="${s.grade}" required><input name="number" type="number" min="1" max="40" value="${s.number}" required></div></label><button class="secondary" type="submit">학생 기본 정보 저장</button></form><div class="history"><h3>변동 내역</h3>${records.filter(r=>r.studentId===id).length?records.filter(r=>r.studentId===id).map(recordHTML).join(''):'<div class="empty">등록된 변동 내역이 없습니다.</div>'}</div></div>`;document.getElementById('modal').classList.remove('hidden');}
    function closeModal(){stopProofCamera();document.getElementById('modal').classList.add('hidden');}
    function savePoint(e,id){e.preventDefault();const f=new FormData(e.target),[type,direction]=f.get('operation').split('-'),score=Number(f.get('score')),reason=f.get('reason');const s=students.find(x=>x.id===id),delta=direction==='add'?score:-score;if(s[type]+delta<0){toast('현재 점수보다 많이 차감할 수 없습니다.');return;}s[type]+=delta;records.unshift({studentId:id,type,score,delta,reason,date:todayLabel()});persist();closeModal();render();toast(`${nameOf(s)} 학생 ${type==='merit'?'상점':'벌점'} ${Math.abs(delta)}점 ${delta>0?'부여':'차감'} 완료`);}
    function saveStudentInfo(e,id){e.preventDefault();const f=new FormData(e.target),s=students.find(x=>x.id===id);s.name=f.get('name');s.grade=Number(f.get('grade'));s.number=Number(f.get('number'));persist();closeModal();render();toast('학생 기본 정보가 저장되었습니다.');}
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400);}
  </script>
</body>
</html>
